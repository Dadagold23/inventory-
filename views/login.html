<!DOCTYPE html>
<html lang="en" data-auth="login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - <?php echo e(APP_NAME); ?></title>
    <link rel="stylesheet" href="<?php echo e(asset('css/foundation.css')); ?>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <style>
        /* Shown only while the sign-in POST is in flight. */
        #auth-loader {
            position: fixed; inset: 0; z-index: 1080;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.94);
        }
        #auth-loader.show { display: flex; }
        #auth-loader .spinner-border { width: 2.5rem; height: 2.5rem; }
    </style>
    <script>
        /* The login page does not use the workspace loader; clear any flag so
           it cannot leak into the next page load. */
        try { sessionStorage.removeItem('inv:navLoader'); } catch (e) {}
    </script>
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-2"><i class="fas fa-boxes-stacked me-2"></i><?php echo e(APP_NAME); ?></h2>
                <p class="text-center text-muted mb-4">Sign in to continue</p>

                <?php if (!empty($error)): ?>
                    <div class="alert alert-danger" role="alert"><?php echo e($error); ?></div>
                <?php endif; ?>

                <?php if (!empty($message)): ?>
                    <div class="alert alert-info" role="alert"><?php echo e($message); ?></div>
                <?php endif; ?>

                <form action="<?php echo e(url('/login')); ?>" method="POST" class="needs-validation" novalidate>
                    <?php echo csrf_field(); ?>

                    <div class="mb-3">
                        <label for="username" class="form-label"><i class="fas fa-user me-2"></i>Username or email</label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="<?php echo e($login ?? ''); ?>" autocomplete="username" required autofocus>
                        <div class="invalid-feedback">Please enter your username or email.</div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    Password resets are handled by an administrator.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <div id="auth-loader" aria-hidden="true">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 mb-0 text-muted">Signing in…</p>
    </div>
    <script>
        (function () {
            'use strict';
            document.querySelectorAll('.needs-validation').forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                        form.classList.add('was-validated');
                        return;
                    }
                    form.classList.add('was-validated');
                    var loader = document.getElementById('auth-loader');
                    if (loader) { loader.classList.add('show'); }
                });
            });
        })();
    </script>
</body>
</html>
