<!DOCTYPE html>
<html lang="en" data-auth="change-password">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - <?php echo e(APP_NAME); ?></title>
    <link rel="stylesheet" href="<?php echo e(asset('css/foundation.css')); ?>">
    <link rel="stylesheet" href="<?php echo e(asset('vendor/sweetalert2/sweetalert2.min.css')); ?>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-2"><i class="fas fa-key me-2"></i>Change Password</h2>
                <p class="text-center text-muted mb-4">Update the password for your account</p>

                <?php if (!empty($error)): ?>
                    <div class="alert alert-danger" role="alert" data-swal-toast="error"><?php echo e($error); ?></div>
                <?php endif; ?>

                <?php if (!empty($message)): ?>
                    <div class="alert alert-success" role="alert" data-swal-toast="success"><?php echo e($message); ?></div>
                <?php endif; ?>

                <form action="<?php echo e(url('/auth?action=change_password')); ?>" method="POST" class="needs-validation" novalidate>
                    <?php echo csrf_field(); ?>

                    <div class="mb-3">
                        <label for="current_password" class="form-label"><i class="fas fa-lock me-2"></i>Current password</label>
                        <input type="password" class="form-control" id="current_password" name="current_password"
                               autocomplete="current-password" required>
                        <div class="invalid-feedback">Please enter your current password.</div>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label"><i class="fas fa-lock-open me-2"></i>New password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password"
                               autocomplete="new-password" minlength="8" required>
                        <div class="invalid-feedback">Use at least 8 characters.</div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label"><i class="fas fa-check me-2"></i>Confirm new password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               autocomplete="new-password" minlength="8" required>
                        <div class="invalid-feedback">Please confirm the new password.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-key me-2"></i>Update Password
                    </button>
                    <a href="<?php echo e(url('/dashboard')); ?>" class="btn btn-link w-100 mt-2">Back to dashboard</a>
                </form>
            </div>
        </div>
    </div>

    <script src="<?php echo e(asset('vendor/sweetalert2/sweetalert2.all.min.js')); ?>"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict';
            document.querySelectorAll('.needs-validation').forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            });

            if (!window.Swal) { return; }
            document.querySelectorAll('[data-swal-toast]').forEach(function (alertBox) {
                var icon = alertBox.getAttribute('data-swal-toast') === 'success' ? 'success' : 'error';
                var text = alertBox.textContent.trim();
                if (text === '') { return; }
                alertBox.remove();
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: icon,
                    title: text,
                    showConfirmButton: false,
                    timer: icon === 'success' ? 4000 : 6000,
                    timerProgressBar: true
                });
            });
        })();
    </script>
</body>
</html>
